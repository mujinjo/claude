<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PARTY CRASH</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0b14;color:#fff;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9}
  canvas{width:100%;height:100%;display:block;background:#000}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,6,20,.82);text-align:center;padding:2%;overflow:auto}
  .hidden{display:none!important}
  h1{margin:0;font-size:clamp(24px,5vw,52px);letter-spacing:.08em;background:linear-gradient(90deg,#ff5ecb,#ffd45e,#5ee0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:.3em 0 .6em;opacity:.85;font-size:clamp(10px,1.45vw,15px);max-width:92%}
  .sec{font-size:clamp(11px,1.6vw,15px);opacity:.7;margin:.6em 0 .3em;letter-spacing:.1em}
  .row{display:flex;gap:clamp(6px,1.2vw,14px);flex-wrap:wrap;justify-content:center}
  .card{width:clamp(58px,11vw,110px);padding:.5em .2em;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid transparent;cursor:pointer;font-size:clamp(10px,1.4vw,14px)}
  .card .e{font-size:clamp(22px,4.5vw,44px);display:block}
  .card.sel{border-color:#ffd45e;background:rgba(255,212,94,.2);transform:scale(1.06)}
  button{margin-top:.8em;padding:.7em 2.2em;font-size:clamp(14px,2.4vw,24px);font-weight:800;border:0;border-radius:999px;color:#1a1030;background:linear-gradient(90deg,#ffd45e,#ff8fd8);cursor:pointer}
  button.ghost{background:rgba(255,255,255,.15);color:#fff;margin-left:.6em}
  .pick{width:clamp(110px,24vw,220px);padding:.9em .5em}
  .pick small{opacity:.85}
  #ctl{position:absolute;left:8px;bottom:8px;display:flex;gap:6px}
  button.mini{margin:0;padding:0;width:clamp(30px,5vw,44px);height:clamp(30px,5vw,44px);font-size:clamp(14px,2.4vw,20px);background:rgba(255,255,255,.2);color:#fff}
  .big{font-size:clamp(28px,7vw,72px);font-weight:900}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="menu" class="ov">
    <h1>PARTY CRASH</h1>
    <div class="sub">피하지 마세요 — <b>일부러 부딪혀야</b> 파티가 살아납니다! 탭 = 점프 (공중에서 또 탭 = 더블점프) · 구멍은 건너고, 검은 가시공은 피하기 · X / ⚡버튼 = 특수능력</div>
    <div class="sec">START THEME (26초마다 자동으로 다음 맵으로 바뀌어요)</div><div class="row" id="themes"></div>
    <div class="sec">CHARACTER</div><div class="row" id="chars"></div><div class="sub" id="abil" style="margin-top:.8em"></div>
    <button id="startBtn">▶ START</button>
  </div>

  <div id="cards" class="ov hidden"><div class="big" style="font-size:clamp(20px,4vw,40px)">STAGE CLEAR!</div><div class="sub">업그레이드를 하나 고르세요 (탭 또는 1·2·3 키)</div><div class="row" id="cardRow"></div></div>
  <div id="pause" class="ov hidden"><div class="big">PAUSED</div><div><button id="resumeBtn">▶ RESUME</button><button class="ghost" id="quitBtn">MENU</button></div></div>
  <div id="ctl" class="hidden"><button class="mini" id="pauseBtn" tabindex="-1">⏸</button><button class="mini" id="muteBtn" tabindex="-1">🔊</button></div>
  <div id="over" class="ov hidden">
    <div class="sub" id="overTitle">PARTY'S OVER</div>
    <div class="big" id="overScore">0</div>
    <div class="sub" id="overInfo"></div><div class="sub" id="overXp" style="color:#ffd45e;font-weight:700"></div>
    <div><button id="retryBtn">↻ RETRY</button><button class="ghost" id="menuBtn">MENU</button></div>
  </div>
</div></div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,GY=420,PX=200,R=26,AIR_H=100;
const TAU=Math.PI*2;
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- audio ---------- */
let ac=null,master=null;
function initAudio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);}catch(e){} } if(ac&&ac.state==='suspended')ac.resume(); }
function tone(f,d,type='sine',v=.15,slideTo){
  if(!ac)return; const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,n); if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,n+d);
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g).connect(master);o.start(n);o.stop(n+d+.02);
}
let noiseBuf=null;
function hat(v=.05){
  if(!ac)return; if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter(),n=ac.currentTime;
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);
  s.connect(f).connect(g).connect(master);s.start(n);
}
const kick=()=>tone(150,.18,'sine',.35,40);
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ---------- themes ---------- */
function layer(speedMul,slotW,draw,dist){
  const off=dist*speedMul, base=Math.floor(off/slotW), frac=off-base*slotW;
  for(let i=-1;i<W/slotW+2;i++){ const k=base+i; draw(i*slotW-frac,k,hash(k)); }
}
function glow(c,col,b){c.shadowColor=col;c.shadowBlur=b}
function noGlow(){ctx.shadowBlur=0}
function face(c,x,y,s,mouth){ // tiny face used on obstacles
  c.fillStyle='#000';c.beginPath();c.arc(x-s*.35,y,s*.12,0,TAU);c.arc(x+s*.35,y,s*.12,0,TAU);c.fill();
  if(mouth){c.beginPath();c.arc(x,y+s*.15,s*.3,0,Math.PI);c.fill();}
}

const THEMES=[
{ id:'haunt',name:'유령의 집',emoji:'🏚️',bpm:112,sky:['#150a2e','#43206b'],ground:'#1d1030',line:'#b57bff',accent:'#b57bff',wave:'triangle',root:57,scale:[0,3,5,7,10,12,15],
  bg(t,d,p){
    ctx.fillStyle='#f6f0c8';ctx.beginPath();ctx.arc(760,110,48,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(60,30,100,.35)';ctx.beginPath();ctx.arc(745,100,10,0,TAU);ctx.arc(775,125,7,0,TAU);ctx.fill();
    layer(.15,160,(x,k,r)=>{ctx.fillStyle='#24124a';const h=90+r*90;ctx.fillRect(x,GY-h-40,110,h+40);
      ctx.beginPath();ctx.moveTo(x-8,GY-h-40);ctx.lineTo(x+55,GY-h-90);ctx.lineTo(x+118,GY-h-40);ctx.fill();
      ctx.fillStyle=(Math.sin(t*2+k)>0)?'#ffd45e':'#3a2266';ctx.fillRect(x+22,GY-h-10,18,26);ctx.fillRect(x+70,GY-h-10,18,26);},d);
    layer(.4,90,(x,k,r)=>{ctx.fillStyle='#120726';ctx.fillRect(x+30,GY-30-r*30,5,30+r*30);ctx.beginPath();ctx.moveTo(x+10,GY-30);ctx.lineTo(x+32,GY-90-r*50);ctx.lineTo(x+54,GY-30);ctx.fill();},d);
  },
  g(x,y,t,m){ctx.fillStyle='#ff8a1f';ctx.beginPath();ctx.ellipse(x,y,26,22,0,0,TAU);ctx.fill();ctx.fillStyle='#2a8a2a';ctx.fillRect(x-3,y-30,6,10);
    ctx.fillStyle='#2a1200';ctx.beginPath();ctx.moveTo(x-12,y-6);ctx.lineTo(x-4,y-6);ctx.lineTo(x-8,y-14);ctx.moveTo(x+12,y-6);ctx.lineTo(x+4,y-6);ctx.lineTo(x+8,y-14);ctx.fill();
    ctx.fillRect(x-12,y+4,24,5);},
  a(x,y,t,m){const f=Math.sin(t*14)*10;ctx.fillStyle='#3b1a6b';ctx.beginPath();ctx.ellipse(x,y,12,14,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.moveTo(x-8,y);ctx.quadraticCurveTo(x-34,y-20+f,x-40,y+6);ctx.quadraticCurveTo(x-24,y+2,x-8,y+10);
    ctx.moveTo(x+8,y);ctx.quadraticCurveTo(x+34,y-20+f,x+40,y+6);ctx.quadraticCurveTo(x+24,y+2,x+8,y+10);ctx.fill();
    ctx.fillStyle='#ff5050';ctx.fillRect(x-6,y-4,4,4);ctx.fillRect(x+2,y-4,4,4);}
},
{ id:'neon',name:'네온 시티',emoji:'🌃',bpm:124,sky:['#07041a','#2a0a4a'],ground:'#0d0820',line:'#00f0ff',accent:'#ff2fd0',wave:'sawtooth',root:55,scale:[0,2,4,7,9,12,14],
  bg(t,d,p){
    const g=ctx.createLinearGradient(0,GY-120,0,GY);g.addColorStop(0,'rgba(255,47,208,0)');g.addColorStop(1,'rgba(255,47,208,.35)');ctx.fillStyle=g;ctx.fillRect(0,GY-120,W,120);
    layer(.12,90,(x,k,r)=>{const h=120+r*160;ctx.fillStyle='#160a30';ctx.fillRect(x,GY-h-30,70,h+30);
      for(let yy=0;yy<h;yy+=22)for(let xx=10;xx<60;xx+=18)if(hash(k*31+yy+xx)>.55){ctx.fillStyle=hash(k+yy)>.5?'#00f0ff':'#ff2fd0';ctx.globalAlpha=.6;ctx.fillRect(x+xx,GY-h-20+yy,8,10);ctx.globalAlpha=1;}},d);
    layer(.3,120,(x,k,r)=>{const h=60+r*110;ctx.fillStyle='#0b0620';ctx.fillRect(x,GY-h,90,h);ctx.strokeStyle=r>.5?'#00f0ff':'#ff2fd0';ctx.lineWidth=2;ctx.strokeRect(x+4,GY-h+4,82,h-4);},d);
  },
  g(x,y,t,m){ctx.fillStyle='#1a1240';ctx.fillRect(x-24,y-24,48,48);ctx.strokeStyle='#00f0ff';ctx.lineWidth=3;ctx.strokeRect(x-24,y-24,48,48);
    const s=1+Math.sin(t*10)*.06;ctx.beginPath();ctx.arc(x,y-6,11*s,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(x,y+14,5*s,0,TAU);ctx.stroke();},
  a(x,y,t,m){ctx.strokeStyle='#ff2fd0';ctx.lineWidth=6;ctx.beginPath();ctx.arc(x,y,22,0,TAU);ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,22,t*3,t*3+1.6);ctx.stroke();}
},
{ id:'candy',name:'캔디 월드',emoji:'🍭',bpm:108,sky:['#ffc2e8','#ffeaa8'],ground:'#ff8fc5',line:'#fff',accent:'#ff4fa8',wave:'sine',root:60,scale:[0,2,4,7,9,12,14],
  bg(t,d,p){
    layer(.1,260,(x,k,r)=>{ctx.fillStyle='#ffd0ee';ctx.beginPath();ctx.ellipse(x+120,GY,150,70+r*60,0,Math.PI,0);ctx.fill();},d);
    layer(.25,200,(x,k,r)=>{ctx.fillStyle='#fff';ctx.fillRect(x+98,GY-120-r*60,6,120+r*60);
      ctx.fillStyle=['#ff4fa8','#5ee0ff','#ffd45e','#9d6bff'][k&3];ctx.beginPath();ctx.arc(x+101,GY-135-r*60,26,0,TAU);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x+101,GY-135-r*60,14,0,5);ctx.stroke();},d);
  },
  g(x,y,t,m){ctx.fillStyle='#c98a5a';ctx.beginPath();ctx.moveTo(x-22,y-4);ctx.lineTo(x-16,y+24);ctx.lineTo(x+16,y+24);ctx.lineTo(x+22,y-4);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-8,22,Math.PI,0);ctx.fill();ctx.beginPath();ctx.arc(x,y-20,13,Math.PI,0);ctx.fill();
    ctx.fillStyle='#e0203f';ctx.beginPath();ctx.arc(x,y-34,6,0,TAU);ctx.fill();},
  a(x,y,t,m){ctx.fillStyle='#e8a05a';ctx.beginPath();ctx.arc(x,y,24,0,TAU);ctx.fill();
    ctx.fillStyle='#ff6fb5';ctx.beginPath();ctx.arc(x,y,22,0,TAU);ctx.fill();
    ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';[[-12,-8],[10,-12],[14,8],[-6,14]].forEach(([a,b])=>ctx.fillRect(x+a,y+b,6,2));}
},
{ id:'sea',name:'심해 클럽',emoji:'🌊',bpm:100,sky:['#04264d','#0a6a9a'],ground:'#0a3550',line:'#6ff3ff',accent:'#6ff3ff',wave:'sine',root:52,scale:[0,2,5,7,9,12,14],
  bg(t,d,p){
    ctx.save();ctx.globalAlpha=.12;ctx.fillStyle='#fff';for(let i=0;i<5;i++){ctx.beginPath();const x=i*220+Math.sin(t*.6+i)*40;ctx.moveTo(x,0);ctx.lineTo(x+60,0);ctx.lineTo(x-120,GY);ctx.lineTo(x-220,GY);ctx.fill();}ctx.restore();
    layer(.15,150,(x,k,r)=>{ctx.fillStyle='#07456b';ctx.beginPath();ctx.ellipse(x+75,GY,90,60+r*70,0,Math.PI,0);ctx.fill();},d);
    layer(.35,70,(x,k,r)=>{ctx.strokeStyle='#1fae7a';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();const h=60+r*90;ctx.moveTo(x,GY);for(let s=1;s<=4;s++)ctx.lineTo(x+Math.sin(t*2+k+s)*10,GY-h*s/4);ctx.stroke();},d);
    ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<14;i++){const bx=(hash(i)*W+d*.2*(.3+hash(i+9)))%W,by=(GY-((t*30*(.4+hash(i+3))+hash(i+5)*GY)%GY));ctx.beginPath();ctx.arc(W-bx,by,2+hash(i+7)*4,0,TAU);ctx.fill();}
  },
  g(x,y,t,m){ctx.fillStyle='#ff6b6b';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x+i*9-6,y+24);ctx.lineTo(x+i*10,y-24+Math.abs(i)*8);ctx.lineTo(x+i*9+6,y+24);ctx.fill();}
    ctx.fillStyle='#ffa0a0';ctx.beginPath();ctx.arc(x,y+6,12,0,TAU);ctx.fill();},
  a(x,y,t,m){const b=Math.sin(t*6)*3;ctx.fillStyle='#d28bff';ctx.beginPath();ctx.arc(x,y-4,22+b*.4,Math.PI,0);ctx.fill();
    ctx.fillRect(x-22,y-4,44,4);ctx.strokeStyle='#d28bff';ctx.lineWidth=3;
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x+i*8,y);ctx.quadraticCurveTo(x+i*8+Math.sin(t*5+i)*8,y+16,x+i*8,y+30+b);ctx.stroke();}
    ctx.fillStyle='#fff';ctx.globalAlpha*=.6;ctx.beginPath();ctx.arc(x-8,y-12,5,0,TAU);ctx.fill();}
},
{ id:'space',name:'우주 정거장',emoji:'🚀',bpm:128,sky:['#02020c','#14134a'],ground:'#1a1b3a',line:'#ffd45e',accent:'#ffd45e',wave:'square',root:57,scale:[0,3,5,7,10,12,15],
  bg(t,d,p){
    for(let i=0;i<70;i++){const x=(hash(i)*W*1.4-d*.04*(.3+hash(i+2)))%W,xx=(x+W)%W;ctx.fillStyle=`rgba(255,255,255,${.3+.7*Math.abs(Math.sin(t*2+i))})`;ctx.fillRect(xx,hash(i+50)*GY,1+hash(i+9)*2,1+hash(i+9)*2);}
    ctx.fillStyle='#5a3fd1';ctx.beginPath();ctx.arc(720,130,70,0,TAU);ctx.fill();ctx.fillStyle='#7d62ff';ctx.beginPath();ctx.arc(700,110,50,0,TAU);ctx.fill();
    ctx.strokeStyle='#ffd45e';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(720,130,110,24,-.3,0,TAU);ctx.stroke();
    layer(.2,240,(x,k,r)=>{ctx.fillStyle='#10113a';ctx.fillRect(x,GY-70-r*60,150,70+r*60);ctx.fillStyle='#1d2060';ctx.fillRect(x+10,GY-60-r*60,130,8);},d);
  },
  g(x,y,t,m){ctx.fillStyle='#8a8aa8';ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*TAU,r=22+hash(i)*6;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.fill();
    ctx.fillStyle='#6a6a88';ctx.beginPath();ctx.arc(x-6,y-6,6,0,TAU);ctx.arc(x+8,y+8,4,0,TAU);ctx.fill();},
  a(x,y,t,m){ctx.fillStyle='#9ff';ctx.beginPath();ctx.arc(x,y-4,14,Math.PI,0);ctx.fill();ctx.fillStyle='#c8c8e0';ctx.beginPath();ctx.ellipse(x,y+2,28,10,0,0,TAU);ctx.fill();
    ctx.fillStyle=Math.sin(t*10)>0?'#ffd45e':'#ff5ecb';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(x+i*14,y+3,3,0,TAU);ctx.fill();}}
}
];

/* ---------- characters ---------- */
function eyes(x,y,s,happy,lookY=0){
  ctx.fillStyle='#fff';
  if(happy){ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-s*.5,y-s*.1);ctx.lineTo(x-s*.25,y+s*.1);ctx.lineTo(x-s*.05,y-s*.1);ctx.moveTo(x+s*.05,y-s*.1);ctx.lineTo(x+s*.25,y+s*.1);ctx.lineTo(x+s*.5,y-s*.1);ctx.stroke();return;}
  ctx.beginPath();ctx.arc(x-s*.28,y,s*.2,0,TAU);ctx.arc(x+s*.28,y,s*.2,0,TAU);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-s*.22,y+lookY,s*.1,0,TAU);ctx.arc(x+s*.34,y+lookY,s*.1,0,TAU);ctx.fill();
}
const CHARS=[
{id:'ghost',name:'고스티',emoji:'👻',col:'#ffffff',draw(x,y,t,h,happy){
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y-4,R,Math.PI,0);ctx.lineTo(x+R,y+R);
  for(let i=0;i<4;i++){const px=x+R-(i+.5)*(R*2/4);ctx.quadraticCurveTo(px+R/4,y+R+(i%2?-8:8)+Math.sin(t*8)*3,px-R/4+0,y+R);}
  ctx.lineTo(x-R,y-4);ctx.fill();ctx.fillStyle='rgba(255,130,170,.6)';ctx.beginPath();ctx.arc(x-16,y+6,5,0,TAU);ctx.arc(x+16,y+6,5,0,TAU);ctx.fill();eyes(x,y-4,R*.9,happy);
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x,y+10,4,0,Math.PI);ctx.fill();}},
{id:'robo',name:'로보',emoji:'🤖',col:'#7fd0ff',draw(x,y,t,h,happy){
  ctx.strokeStyle='#bbb';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-R);ctx.lineTo(x,y-R-12);ctx.stroke();ctx.fillStyle=Math.sin(t*10)>0?'#ff5050':'#ffd45e';ctx.beginPath();ctx.arc(x,y-R-14,5,0,TAU);ctx.fill();
  ctx.fillStyle='#7fd0ff';ctx.beginPath();ctx.roundRect(x-R,y-R,R*2,R*2,9);ctx.fill();ctx.fillStyle='#1a2a44';ctx.beginPath();ctx.roundRect(x-R+5,y-R+8,R*2-10,20,7);ctx.fill();
  ctx.fillStyle='#5effa0';if(happy){ctx.fillRect(x-14,y-8,10,4);ctx.fillRect(x+4,y-8,10,4);}else{ctx.beginPath();ctx.arc(x-9,y-4,5,0,TAU);ctx.arc(x+9,y-4,5,0,TAU);ctx.fill();}
  ctx.fillStyle='#fff';for(let i=-2;i<=2;i++)ctx.fillRect(x+i*7-2,y+16,4,5);}},
{id:'cat',name:'냥비트',emoji:'🐱',col:'#ffb04a',draw(x,y,t,h,happy){
  ctx.fillStyle='#ffb04a';ctx.beginPath();ctx.moveTo(x-R,y-8);ctx.lineTo(x-R+2,y-R-14);ctx.lineTo(x-6,y-R+2);ctx.moveTo(x+R,y-8);ctx.lineTo(x+R-2,y-R-14);ctx.lineTo(x+6,y-R+2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x,y+10,12,9,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#8a4a10';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-8,y-R+2);ctx.lineTo(x-8,y-R+10);ctx.moveTo(x+8,y-R+2);ctx.lineTo(x+8,y-R+10);ctx.stroke();
  eyes(x,y-4,R*.9,happy);ctx.fillStyle='#ff6f91';ctx.beginPath();ctx.arc(x,y+5,3,0,TAU);ctx.fill();

/* ---------- patterns ---------- */
const OFF={g:0,a:100,h:200,s:100,m:0,ma:100};
// items: [offsetBeats, kind, (offsetHeight for orbs)]
const PATS=[
 {key:'g',min:0,w:3,len:1,items:[[0,'g']]},
 {key:'a',min:0,w:3,len:1,items:[[0,'a']]},
 {key:'gg',min:.3,w:2,len:2,items:[[0,'g'],[1,'g']]},
 {key:'ag',min:.5,w:2,len:3,items:[[0,'a'],[2,'g']]},
 {key:'gap',min:.3,w:2.5,len:2,gap:[0],tip:'🕳️ 구멍! 점프로 건너요 (공중에서 한 번 더 탭 = 더블점프)'},
 {key:'arc',min:.5,w:1.6,len:2,items:[[0,'o',55],[.5,'o',115],[1,'o',55]],tip:'🔮 노란 구슬은 보너스 (놓쳐도 괜찮아요)'},
 {key:'h',min:.8,w:2,len:2,items:[[0,'h']],tip:'✨ 높이 뜬 타깃은 더블점프로 박아요'},

 {key:'mag',min:1.6,w:1.5,len:3,items:[[0,'ma'],[2,'g']]},

 {key:'gapa',min:2.3,w:2,len:2,gap:[0],items:[[0,'a']]},

 {key:'gapg',min:3.3,w:1.5,len:3,gap:[0],items:[[2.5,'g']]},
 {key:'gap2',min:3.8,w:1.2,len:4,gap:[0,3]},
 {key:'mh',min:4.6,w:1.2,len:4,items:[[0,'m'],[2,'h']]},
 {key:'gaph',min:5.6,w:1.2,len:3,gap:[0],items:[[0,'h']]}
];
function genPatterns(){
  const L=lvl();
  while(patT<t+3.2){
    const avail=PATS.filter(p=>p.min<=L);let tot=0;
    const ws=avail.map(p=>{const w=p.min===0?Math.max(.6,p.w-L*.25):p.w+L*.12;tot+=w;return w;});
    let r=Math.random()*tot,p=avail[0];
    for(let i=0;i<avail.length;i++){r-=ws[i];if(r<=0){p=avail[i];break;}}
    const fresh=avail.find(q=>q.tip&&!seen[q.key]);if(fresh&&Math.random()<.7)p=fresh;
    const gw=Math.min(.44,.30+.03*L);
    let tip=(p.tip&&!seen[p.key])?p.tip:null;if(tip)seen[p.key]=1;
    (p.items||[]).forEach(([o,k,off])=>{obs.push({tA:patT+o*beatDur,k,off:off!=null?off:OFF[k],hit:false,miss:false,done:false,tip});tip=null;});
    (p.gap||[]).forEach(o=>{gaps.push({tA:patT+o*beatDur,w:gw,bridged:false,tip});tip=null;});
    patT+=(p.len+Math.max(1,2.4-L*.12)+(Math.random()<.4?1:0))*beatDur;
  }
}

/* ---------- helpers ---------- */
function spawnBurst(x,y,col,n,spd=300){
  for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,l:.6+Math.random()*.5,m:1.1,c:col,r:3+Math.random()*5,g:700});}
}
function confetti(){parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*80,vy:100+Math.random()*200,l:2.5,m:2.5,c:`hsl(${Math.random()*360},90%,65%)`,r:3+Math.random()*4,g:60,sq:1});}
function pop(text,x,y,col,life=.8,v=40,size=26){pops.push({text,x,y,l:life,m:life,c:col,v,size});}
function tip(text){pop(text,W/2,128,'#fff',2.6,0,22);}
const gapX=g=>PX+(g.tA-t)*speed;
function gapAt(x){
  for(const g of gaps){if(g.bridged)continue;const half=g.w*speed/2-S.gapMargin;if(Math.abs(x-gapX(g))<half)return g;}
  return null;
}

/* ---------- input ---------- */
function jump(){if(mode==='play')jumpBuf=.12;}
function tryJump(){
  if(jumpBuf<=0||falling)return;

  if(grounded){vy=830;h=.6;jumps=1;jumpBuf=0;squash=1;tone(320,.15,'square',.06,640);}

}

const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- events ---------- */
function onHit(o,perfect,oy){
  o.hit=true;hits++;combo++;maxCombo=Math.max(maxCombo,combo);
  const pts=Math.round((perfect?150:100)*(1+Math.min(combo,50)*.1)*S.score);score+=pts;
  meter=Math.min(100,meter+(perfect?8+S.perfHeal:5));if(!ab.on)sp=Math.min(100,sp+(perfect?13:9)*S.spGain);
  const idx=(combo-1)%T.scale.length,oct=Math.floor((combo-1)/T.scale.length)%2;
  tone(mtof(T.root+12+T.scale[idx]+oct*12),.28,T.wave,.12);tone(mtof(T.root+24+T.scale[idx]),.12,'sine',.05);
  spawnBurst(PX,py,C.col,16);spawnBurst(PX+30,oy,T.accent,10,260);
  pop(perfect?'PERFECT!':'POP!',PX+40,py-60,perfect?'#ffd45e':'#fff');
  if(combo%10===0){pop('COMBO x'+combo,W/2,150,T.accent,1,30,30);flash=1;for(let i=0;i<40;i++)confetti();}
  hitAnim=.2;shake=perfect?5:3;buzz(8);
}
function onOrb(o,oy){
  o.hit=true;score+=Math.round(40*(1+combo*.05)*S.score);if(!ab.on)sp=Math.min(100,sp+3*S.spGain);meter=Math.min(100,meter+2);
  tone(mtof(T.root+36+T.scale[(Math.random()*T.scale.length)|0]),.12,'sine',.08);spawnBurst(PX+20,oy,'#ffe066',8,200);
}
function onMiss(o){
  o.miss=true;
  if(absorb())return;
  misses++;combo=0;meter-=16*S.dmg;shake=12;buzz(50);
  tone(160,.3,'sawtooth',.12,60);pop('MISS',PX+120,py-40,'#ff5a6a');
  if(meter<=0)endGame();
}
function onBad(o){
  o.hit=true;
  if(absorb())return;
  combo=0;meter-=16*S.dmg;shake=14;hitAnim=.3;buzz(60);
  tone(120,.4,'sawtooth',.15,40);spawnBurst(PX,py,'#ff3b5c',22,360);pop('OUCH!',PX+60,py-60,'#ff3b5c',.9,40,30);
  if(meter<=0)endGame();
}
function startFall(){
  falling=true;vy=-100;
  if(absorb()){h=Math.max(h,0);vy=0;respawnSoon=true;}
  else{meter-=40*S.dmg;combo=0;shake=14;buzz(80);tone(600,.8,'sawtooth',.14,50);pop('FALL!',PX+40,GY-120,'#ff3b5c',1,0,38);if(meter<=0)endGame();}
}
let respawnSoon=false;
function respawn(){
  falling=false;respawnSoon=false;h=300;vy=0;jumps=1;invul=1.6;
  for(const g of gaps)if(Math.abs(gapX(g)-PX)<420)g.bridged=true;
  pop('버블 구조!',PX+40,150,T.accent,1,0,28);tone(700,.2,'sine',.1,1000);
}
function newStage(st){
  prevT=T;stageIdx=st;T=THEMES[(sel.theme+st)%THEMES.length];wipe=0;
  meter=Math.min(100,meter+18);if(!ab.on)sp=Math.min(100,sp+20);flash=1;shake=8;
  pop('STAGE '+(st+1),W/2,230,'#fff',2.2,0,56);pop(T.emoji+' '+T.name,W/2,285,T.accent,2.2,0,34);
  for(let i=0;i<50;i++)confetti();
  [0,4,7,12].forEach((n,i)=>setTimeout(()=>tone(mtof(T.root+24+n),.25,'square',.08),i*90));
  setTimeout(()=>{if(mode==='play')offerCards();},700);
}

/* ---------- update ---------- */
function update(rdt){
  const slow=(ab.on&&C.id==='cat')?.55:1,dt=rdt*slow,L=lvl();
  t+=dt;dist+=speed*dt;speed=520+Math.min(360,L*30);bpm=Math.min(150,104+L*5);
  pl+=(Math.min(1,combo/30)-pl)*Math.min(1,dt*2);
  const st=Math.floor(t/STAGE_T);if(st!==stageIdx)newStage(st);
  if(wipe<1)wipe=Math.min(1,wipe+rdt/1.1);
  if(ab.on){ab.t-=rdt;if(ab.t<=0){ab.on=false;sp=0;vy=0;}}
  if(invul>0)invul-=rdt;
  while(t>=nextBeat){
    lastBeat=nextBeat;beatDur=60/bpm;nextBeat+=beatDur;beatN++;
    kick();if(beatN%4===0||beatN%4===2)tone(mtof(T.root-12+(beatN%4===0?0:5)),.25,'triangle',.15);
    setTimeout(()=>hat(.05+pl*.04),beatDur*500);
    if(pl>.5&&Math.random()<.5)confetti();
  }
  genPatterns();

  const hover=ab.on&&C.id==='alien',ghost=ab.on&&C.id==='ghost',big=ab.on&&C.id==='slime',robo=ab.on&&C.id==='robo';
  jumpBuf=Math.max(0,jumpBuf-dt);
  if(falling){if(respawnSoon){respawn();}else{vy-=G*dt;h+=vy*dt;if(h<-320&&meter>0)respawn();}}
  else if(hover){
    if(jumpBuf>0){hoverTarget=hoverTarget>50?0:AIR_H;jumpBuf=0;tone(hoverTarget?800:300,.12,'square',.06,hoverTarget?1200:200);}
    h+=(hoverTarget-h)*Math.min(1,dt*14);vy=0;jumps=0;
  }else{
    tryJump();
    const wasAir=h>0;
    if(h>0||vy>0){vy-=G*dt;h+=vy*dt;}
    if(h<=0){
      h=0;
      if(big){vy=640;h=.6;jumps=1;squash=-.5;tone(200,.08,'sine',.08,380);}
      else if(!ghost&&invul<=0&&gapAt(PX))startFall();
      else{vy=0;jumps=0;if(wasAir)squash=-.6;}
    }
  }
  py=GY-R-h;squash+=(-squash)*Math.min(1,dt*12);

  const tolG=big?95:S.tolG,tolB=big?85:34;
  for(const o of obs){
    o.x=PX+(o.tA-t)*speed;if(o.k==='s')o.off=100+Math.sin(t*3+o.tA)*70;
    if(o.tip&&!o.tipShown&&o.x<W-80){o.tipShown=1;tip(o.tip);}
    if(o.hit||o.miss||o.done)continue;
    const dx=o.x-PX,oy=GY-R-o.off,dy=Math.abs(py-oy),bad=o.k==='m'||o.k==='ma';
    if(falling){if(dx<-38)o.done=true;continue;}
    if(Math.abs(dx)<38){
      if(bad){if(dy<tolB&&invul<=0&&!ghost)onBad(o);}
      else if(o.k==='o'){if(dy<S.orbTol)onOrb(o,oy);}
      else if(dy<tolG||robo)onHit(o,robo||dy<18||(o.k==='g'&&h<12),oy);
    }else if(dx<-38){
      if(bad||o.k==='o')o.done=true;else onMiss(o);
    }
    if(mode!=='play')return;
  }
  obs=obs.filter(o=>o.x>-80);
  for(const g of gaps){if(g.tip&&!g.tipShown&&gapX(g)<W-80){g.tipShown=1;tip(g.tip);}}
  gaps=gaps.filter(g=>gapX(g)+g.w*speed/2>-100);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt;}
  parts=parts.filter(p=>p.l>0&&p.y<H+20);
  for(const p of pops){p.y-=p.v*rdt;p.l-=rdt;}pops=pops.filter(p=>p.l>0);
  shake*=Math.pow(.01,rdt);hitAnim=Math.max(0,hitAnim-rdt);flash=Math.max(0,flash-rdt*2.5);
  if(meter<=0&&mode==='play')endGame();
}

function endGame(){
  if(mode==='over')return;
  mode='over';document.getElementById('ctl').classList.add('hidden');
  const k=C.id;const isBest=score>(best[k]||0);if(isBest)best[k]=score;best[k]=best[k]||0;
  const xp=Math.floor(score/15)+stageIdx*30+hits,l0=lvOf(prog[k]);prog[k]+=xp;const l1=lvOf(prog[k]);save();
  document.getElementById('overTitle').textContent=isBest?'🎉 NEW BEST!':"PARTY'S OVER";
  document.getElementById('overScore').textContent=score.toLocaleString();
  document.getElementById('overInfo').textContent=`${C.name} · STAGE ${stageIdx+1}  |  최대 콤보 ${maxCombo}  ·  POP ${hits}  ·  MISS ${misses}  |  BEST ${best[k].toLocaleString()}`;
  document.getElementById('overXp').textContent=`+${xp} XP  ·  Lv.${l0+1}`+(l1>l0?` → Lv.${l1+1} 🎉 레벨 업! 능력치가 올랐어요`:`  (다음 레벨까지 ${Math.round((1-lvFrac(prog[k]))*100)}%)`);
  document.getElementById('over').classList.remove('hidden');
  tone(300,.6,'sawtooth',.15,60);
}

/* ---------- render ---------- */
function drawMine(){
  ctx.fillStyle='#14061c';ctx.strokeStyle='#ff3b5c';ctx.lineWidth=3;
  ctx.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU+t*2,r=i%2?16:27;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#ff3b5c';ctx.beginPath();ctx.arc(-7,-2,4,0,TAU);ctx.arc(7,-2,4,0,TAU);ctx.fill();
  ctx.fillRect(-8,8,16,3);
}
function drawOrb(){
  const r=ctx.createRadialGradient(0,0,2,0,0,16);r.addColorStop(0,'#fff');r.addColorStop(.5,'#ffe066');r.addColorStop(1,'rgba(255,224,102,0)');
  ctx.fillStyle=r;ctx.beginPath();ctx.arc(0,0,16,0,TAU);ctx.fill();
}

function drawBackdrop(TH,pulse){
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,TH.sky[0]);g.addColorStop(1,TH.sky[1]);ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  if(pl>.05){ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const a=Math.sin(t*.9+i*1.7)*.5,x=W*(i+.5)/5;ctx.fillStyle=`hsla(${(t*60+i*70)%360},90%,60%,${.08*pl+.05*pulse*pl})`;ctx.beginPath();ctx.moveTo(x-8,0);ctx.lineTo(x+8,0);ctx.lineTo(x+a*420+90,GY);ctx.lineTo(x+a*420-90,GY);ctx.fill();}ctx.restore();}
  ctx.save();ctx.translate(0,-pulse*3*(1+pl));TH.bg(t,dist,pulse);ctx.restore();
  ctx.fillStyle=TH.ground;ctx.fillRect(-20,GY,W+40,H-GY+20);
  ctx.strokeStyle=TH.line;ctx.lineWidth=4;glow(ctx,TH.line,10+pulse*20);ctx.beginPath();ctx.moveTo(-20,GY);ctx.lineTo(W+20,GY);ctx.stroke();noGlow();
  ctx.fillStyle='rgba(255,255,255,.07)';const tw=80,off=dist%tw;for(let x=-off;x<W;x+=tw)ctx.fillRect(x,GY+8,tw/2,10);
  ctx.fillStyle=TH.accent;ctx.globalAlpha=.25+.5*pulse;ctx.fillRect(PX-34,GY+2,68,6);ctx.globalAlpha=1;
  // gaps
  for(const gp of gaps){
    const gx=gapX(gp),half=gp.w*speed/2;if(gx+half<-20||gx-half>W+20)continue;
    if(gp.bridged){ctx.fillStyle=TH.accent;ctx.globalAlpha=.35+.2*Math.sin(t*10);ctx.fillRect(gx-half,GY-2,half*2,7);ctx.globalAlpha=1;continue;}
    const ag=ctx.createLinearGradient(0,GY,0,H);ag.addColorStop(0,'#000');ag.addColorStop(1,'#2a0610');
    ctx.fillStyle=ag;ctx.fillRect(gx-half,GY-4,half*2,H-GY+10);
    ctx.strokeStyle='#ff4a5a';ctx.lineWidth=3;glow(ctx,'#ff4a5a',8+pulse*10);ctx.beginPath();ctx.moveTo(gx-half,GY-2);ctx.lineTo(gx-half,H);ctx.moveTo(gx+half,GY-2);ctx.lineTo(gx+half,H);ctx.stroke();noGlow();
    ctx.fillStyle='#ff4a5a';ctx.globalAlpha=.4+.4*pulse;ctx.font='900 22px system-ui';ctx.textAlign='center';ctx.fillText('▼ ▼ ▼',gx,GY+40);ctx.globalAlpha=1;
  }
}
function drawObs(TH,pulse){
  for(const o of obs){
    if(o.x<-60||o.x>W+60||o.hit)continue;
    const y=GY-R-o.off;
    ctx.save();if(o.miss)ctx.globalAlpha=.3;
    const near=Math.max(0,1-Math.abs(o.x-PX)/500);
    if(!o.miss&&o.k!=='m'&&o.k!=='ma')glow(ctx,TH.accent,6+near*18);
    const bob=(o.k==='a'||o.k==='h')?Math.sin(t*4+o.tA)*4:0;
    ctx.translate(o.x,y+bob);const sc=1+pulse*.08;ctx.scale(sc,sc);
    if(o.k==='m'||o.k==='ma')drawMine();
    else if(o.k==='o')drawOrb();
    else{
      TH[o.k==='g'?'g':'a'](0,0,t,o.miss);
      if(o.k==='h'){ctx.strokeStyle='#ffe066';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.arc(0,0,38,t*2,t*2+TAU);ctx.stroke();ctx.setLineDash([]);}
      if(o.k==='s'){ctx.strokeStyle=TH.accent;ctx.globalAlpha*=.5;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(0,34);ctx.stroke();}
    }
    ctx.restore();noGlow();
  }
}

function render(){
  ctx.save();
  if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const pulse=Math.pow(Math.max(0,1-(t-lastBeat)/beatDur),2);
  if(wipe<1&&prevT){
    drawBackdrop(prevT,pulse);drawObs(prevT,pulse);
    const wx=W*(1-wipe);
    ctx.save();ctx.beginPath();ctx.rect(wx,-20,W,H+40);ctx.clip();drawBackdrop(T,pulse);drawObs(T,pulse);ctx.restore();
    ctx.fillStyle='#fff';glow(ctx,T.accent,30);ctx.fillRect(wx-3,0,6,H);noGlow();
  }else{drawBackdrop(T,pulse);drawObs(T,pulse);}

  const robo=ab.on&&C.id==='robo',ghost=ab.on&&C.id==='ghost',big=ab.on&&C.id==='slime',hover=ab.on&&C.id==='alien';
  if(robo){ctx.strokeStyle='rgba(94,255,160,.5)';ctx.lineWidth=2;for(const o of obs){if(o.hit||o.miss||o.k==='m'||o.k==='ma'||o.x<PX||o.x>W)continue;ctx.beginPath();ctx.moveTo(PX,py);ctx.lineTo(o.x,GY-R-o.off);ctx.stroke();}}
  if(hover){const bg=ctx.createLinearGradient(0,py,0,GY);bg.addColorStop(0,'rgba(160,255,200,.4)');bg.addColorStop(1,'rgba(160,255,200,0)');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(PX-12,py+R);ctx.lineTo(PX+12,py+R);ctx.lineTo(PX+46,GY+4);ctx.lineTo(PX-46,GY+4);ctx.fill();}
  // player
  if(!falling&&!gapAt(PX)){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(PX,GY+4,R*Math.max(.2,1-h/260)*(big?1.5:1),6,0,0,TAU);ctx.fill();}
  if(ab.on){const ag=ctx.createRadialGradient(PX,py,10,PX,py,70+Math.sin(t*12)*6);ag.addColorStop(0,'rgba(255,212,94,.35)');ag.addColorStop(1,'rgba(255,212,94,0)');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(PX,py,80,0,TAU);ctx.fill();}
  const sq=squash,sx=1-sq*.25,sy=1+sq*.3,dancing=pulse*.1*(1+pl),bs=big?1.6:1;
  ctx.save();
  ctx.translate(PX,py+R);ctx.rotate(Math.sin(t*20)*dancing*.5+(h>0&&!falling?-vy/9000:0)+(falling?t*8:0));ctx.scale(sx*(1+dancing)*bs,sy*(1-dancing*.5)*bs);ctx.translate(-PX,-(py+R));
  let al=1;if(ghost)al=.55;if(invul>0)al*=Math.sin(t*40)>0?1:.35;if(hitAnim>0)al*=.55+.45*Math.sin(hitAnim*80);
  ctx.globalAlpha=al;
  C.draw(PX,py,t,h,hitAnim>0);
  ctx.restore();ctx.globalAlpha=1;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;if(p.sq){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.l*6);ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;
  if(ab.on&&C.id==='cat'){const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);vg.addColorStop(0,'rgba(80,120,255,0)');vg.addColorStop(1,'rgba(80,120,255,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);}
  ctx.textAlign='center';
  for(const p of pops){ctx.font=`900 ${p.size}px system-ui,sans-serif`;ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.c;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.lineWidth=5;ctx.strokeText(p.text,p.x,p.y);ctx.fillText(p.text,p.x,p.y);}
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(0,0,W,H);}
  ctx.restore();
  hud(pulse);
}

function bar(x,y,w,hh,v,col,glowOn){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(x-4,y-4,w+8,hh+8,hh/2+4);ctx.fill();
  if(v>0){ctx.fillStyle=col;if(glowOn)glow(ctx,col,glowOn);ctx.beginPath();ctx.roundRect(x,y,w*Math.min(1,v),hh,hh/2);ctx.fill();noGlow();}
}
function hud(pulse){
  const bx=30,by=24,bw=380;
  const m=Math.max(0,meter)/100,col=m>.5?T.accent:m>.25?'#ffd45e':'#ff4a5a';
  bar(bx,by,bw,22,m,col,m<.25?18*(1+Math.sin(t*20)):8);
  ctx.fillStyle='#fff';ctx.font='700 13px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('PARTY 🎉',bx+8,by+17);
  const spv=ab.on?ab.t/ab.max:sp/100,ready=!ab.on&&sp>=100;
  bar(bx,by+36,bw*.62,12,spv,ab.on?'#ffd45e':ready?'#ffd45e':'#8a7bff',ready?14+10*Math.sin(t*12):0);
  ctx.fillStyle='#fff';ctx.font='700 11px system-ui,sans-serif';ctx.fillText(ab.on?'ACTIVE: '+ABIL[C.id].name:(ready?'⚡ READY! (X / 버튼)':'SPECIAL'),bx+bw*.62+14,by+47);
  ctx.textAlign='right';ctx.font='900 34px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=5;
  ctx.strokeText(score.toLocaleString(),W-30,52);ctx.fillText(score.toLocaleString(),W-30,52);
  ctx.font='800 15px system-ui,sans-serif';ctx.fillStyle=T.accent;ctx.strokeText(`STAGE ${stageIdx+1} · ${T.name}`,W-30,76);ctx.fillText(`STAGE ${stageIdx+1} · ${T.name}`,W-30,76);
  ctx.textAlign='left';
  if(combo>1){ctx.font=`900 ${24+pulse*6}px system-ui,sans-serif`;ctx.fillStyle=T.accent;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=5;ctx.strokeText(combo+' COMBO',bx,100);ctx.fillText(combo+' COMBO',bx,100);}
  // stage progress
  {const px0=450,pw=290,py0=28,pr=Math.min(1,(t%STAGE_T)/STAGE_T),nx=THEMES[(sel.theme+stageIdx+1)%THEMES.length];
   bar(px0,py0,pw,12,pr,T.accent,6);
   ctx.textAlign='center';ctx.font='20px system-ui,sans-serif';ctx.fillStyle='#fff';
   ctx.fillText(T.emoji,px0-20,py0+14);ctx.fillText(nx.emoji,px0+pw+20,py0+14);
   ctx.font='22px system-ui,sans-serif';ctx.fillText(C.emoji,px0+pw*pr,py0-8);
   ctx.font='700 11px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText(`다음 맵까지 ${Math.ceil(STAGE_T-(t%STAGE_T))}초`,px0+pw/2,py0+34);}
  // shields & picked cards
  ctx.textAlign='left';ctx.font='18px system-ui,sans-serif';ctx.fillStyle='#fff';
  ctx.fillText((S.shield>0?'🛡️×'+S.shield+'  ':'')+picked.join(''),112,H-18);
  // special button
  const bxx=W-200,byy=H-96,bww=170,bhh=70;
  ctx.save();ctx.globalAlpha=ready?1:.55;if(ready)glow(ctx,'#ffd45e',16+10*Math.sin(t*12));
  ctx.fillStyle=ready?'#ffd45e':ab.on?'rgba(255,212,94,.5)':'rgba(255,255,255,.18)';ctx.beginPath();ctx.roundRect(bxx,byy,bww,bhh,18);ctx.fill();noGlow();
  ctx.fillStyle=ready?'#1a1030':'#fff';ctx.textAlign='center';ctx.font='900 20px system-ui,sans-serif';ctx.fillText('⚡ '+ABIL[C.id].name,bxx+bww/2,byy+32);
  ctx.font='700 12px system-ui,sans-serif';ctx.fillText(ab.on?'발동 중!':ready?'TAP · [X]':'타깃을 맞춰 충전',bxx+bww/2,byy+54);ctx.restore();
  if(t<beatDur*5&&mode==='play'){ctx.textAlign='center';ctx.font='900 30px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=5;
    ctx.strokeText('부딪혀라!  탭 = 점프 · 공중에서 또 탭 = 더블점프',W/2,240);ctx.fillText('부딪혀라!  탭 = 점프 · 공중에서 또 탭 = 더블점프',W/2,240);}
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(mode==='play')update(dt);
  if(mode==='play'||mode==='over'||mode==='card'||mode==='pause')render();
  else renderIdle(ts/1000);
  requestAnimationFrame(frame);
}
function renderIdle(s){
  T=THEMES[sel.theme];C=CHARS[sel.char];prevT=null;wipe=1;stageIdx=0;
  t=s;dist=s*200;speed=520;lastBeat=Math.floor(s*2)/2;beatDur=.5;combo=0;pl=.3;h=0;vy=0;py=GY-R;shake=0;flash=0;hitAnim=0;squash=0;
  obs=[];gaps=[];parts=[];pops=[];meter=70;score=0;sp=0;ab={on:false,t:0,max:1};falling=false;invul=0;picked=[];S=buildStats();
  render();
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function buildMenu(){
  const th=$('themes'),ch=$('chars');th.innerHTML='';ch.innerHTML='';
  THEMES.forEach((x,i)=>{const d=document.createElement('div');d.className='card'+(i===sel.theme?' sel':'');d.innerHTML=`<span class="e">${x.emoji}</span>${x.name}`;d.onclick=()=>{sel.theme=i;save();buildMenu();};th.appendChild(d);});
  CHARS.forEach((x,i)=>{const d=document.createElement('div');d.className='card'+(i===sel.char?' sel':'');const xp=prog[x.id];
    d.innerHTML=`<span class="e">${x.emoji}</span>${x.name}<br><small>Lv.${lvOf(xp)+1} · ⚡${ABIL[x.id].name}</small><div style="height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:4px"><div style="height:100%;width:${Math.round(lvFrac(xp)*100)}%;background:#ffd45e;border-radius:2px"></div></div>`;
    d.onclick=()=>{sel.char=i;save();buildMenu();};ch.appendChild(d);});
  const c=CHARS[sel.char],l=lvOf(prog[c.id]);
  $('abil').innerHTML=`${c.emoji} <b>${c.name}</b> Lv.${l+1} — 특수능력 [${ABIL[c.id].name}] ${ABIL[c.id].desc}<br><small>레벨 보너스: 판정 +${Math.min(16,l*.8).toFixed(1)} · 충전 +${l*3}% · 지속 +${l*2}% · 시작 체력 ${Math.round(60+l*1.5)}${l>=4?' · 🛡️시작 보호막':' · (Lv.5에 🛡️시작 보호막)'}${l>=9?' · 특수 30% 충전 시작':''}</small>`;
}
function start(){initAudio();reset();mode='play';$('menu').classList.add('hidden');$('over').classList.add('hidden');$('pause').classList.add('hidden');$('cards').classList.add('hidden');$('ctl').classList.remove('hidden');}
function toMenu(){mode='menu';$('over').classList.add('hidden');$('pause').classList.add('hidden');$('cards').classList.add('hidden');$('ctl').classList.add('hidden');$('menu').classList.remove('hidden');buildMenu();}
function pause(){if(mode==='play'){mode='pause';$('pause').classList.remove('hidden');}else if(mode==='pause'){mode='play';$('pause').classList.add('hidden');}}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:1;$('muteBtn').textContent=muted?'🔇':'🔊';}
$('startBtn').onclick=start;$('retryBtn').onclick=start;$('menuBtn').onclick=toMenu;$('quitBtn').onclick=toMenu;$('resumeBtn').onclick=pause;
$('pauseBtn').onclick=e=>{e.currentTarget.blur();pause();};$('muteBtn').onclick=e=>{e.currentTarget.blur();toggleMute();};
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(x>W-210&&y>H-106)useSpecial();else jump();
});
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(mode==='card'&&/^Digit[123]$/.test(e.code)){const c=offerCards.cur[+e.code[5]-1];if(c)choose(c);return;}
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
  else if(e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='Enter'){e.preventDefault();useSpecial();}
  else if(e.code==='KeyP'||e.code==='Escape')pause();
  else if(e.code==='KeyM')toggleMute();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause();});
buildMenu();reset();requestAnimationFrame(frame);
})();
</script>
</body>
